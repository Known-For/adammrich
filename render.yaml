services:
  - type: web
    name: adammrich-com
    runtime: static
    buildCommand: ""
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /home/
        destination: /

    # ---- Caching -------------------------------------------------------
    # Render's default for static sites is `max-age=0, s-maxage=300`: browsers
    # re-validate every asset on every visit and the edge drops everything
    # after five minutes, so almost all traffic bills origin bandwidth.
    #
    # NOTE: these only take effect if the service is Blueprint-managed. A site
    # created via New -> Static Site ignores this file; set the same rules
    # under Settings -> Headers in the dashboard. See README.
    #
    # Path syntax matters: Render's `*` does not cross slashes ("/*.css
    # matches CSS files in the root only"), so nested directories need
    # `/**/*`. Depths in dist/: assets 3-4, static1 4-8, definitions 5,
    # images 5-8, scripts 1, fonts 1.
    #
    # HTML is left on Render's default deliberately. Pages are served as
    # directory URLs (/, /content-strategy/), so an extension-based rule
    # would never match, and the documents are small next to the assets.
    headers:
      - path: /assets.squarespace.com/**/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static1.squarespace.com/**/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /definitions.sqspcdn.com/**/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /scripts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Image paths carry a Squarespace asset UUID and the sized variants are
      # content-named, so they are stable — but this is the one place content
      # might be swapped in place by hand, so cap at 30 days rather than
      # marking immutable. To force a refresh, rename and update references.
      - path: /images.squarespace-cdn.com/**/*
        name: Cache-Control
        value: public, max-age=2592000
