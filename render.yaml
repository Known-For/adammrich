services:
  - type: web
    name: adammrich-com
    runtime: static
    buildCommand: ""
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /home/
        destination: /

    # ---- Caching -------------------------------------------------------
    # Render's default for static sites is `max-age=0, s-maxage=300`, which
    # means browsers re-validate every asset on every visit and the CDN edge
    # drops everything after 5 minutes — so nearly all traffic falls through
    # to the origin and bills bandwidth. Everything below /assets…, /static1…,
    # /definitions… and /scripts is content-hashed or version-pinned in its
    # path, so it can be cached permanently and immutably. Render purges the
    # CDN on every deploy, so long s-maxage values are safe.
    headers:
      - path: /assets.squarespace.com/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static1.squarespace.com/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /definitions.sqspcdn.com/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /scripts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Image paths carry a Squarespace asset UUID, so they are stable in
      # practice — but they are the one place content might be swapped in
      # place by hand, so cap at 30 days rather than marking immutable.
      # To force an early refresh, rename the file and update the reference.
      - path: /images.squarespace-cdn.com/*
        name: Cache-Control
        value: public, max-age=2592000
      # HTML is the only mutable surface: keep the browser copy short-lived
      # but let the edge hold it, since deploys purge the edge anyway.
      - path: /*.html
        name: Cache-Control
        value: public, max-age=300, s-maxage=86400
      - path: /
        name: Cache-Control
        value: public, max-age=300, s-maxage=86400
